name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: ios
            tags: -simulator
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}${{ matrix.tags }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - uses: holepunchto/actions/setup-gtk@v1
        with:
          webkit: true
      - uses: holepunchto/actions/setup-windows-app-runtime@v1
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: ${{ runner.os == 'Linux' }}
      - run: npm test -- --platform ${{ matrix.platform }}
